name: release

# Publishing is tag-triggered and lockstep: all ten packages carry the same
# version and go out together. That matches how the repo is actually validated —
# the gates test the packages as one system, so "a patch to just the core" is
# not a thing that can be verified in isolation here.
#
# Nothing publishes until the whole suite has passed in this job. A release that
# runs the tests in a different workflow is a release that can ship while a test
# is red.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and inspect, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm provenance: the registry verifies the package was built by
  # this workflow, at this commit, and shows a linked attestation on npm.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        # build + tests + publint + attw + size budgets, for every package.
        run: pnpm verify

      - name: Check the tag matches the packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FAILED=0
          for manifest in packages/*/package.json; do
            VERSION=$(node -p "require('./$manifest').version")
            NAME=$(node -p "require('./$manifest').name")
            if [ "$VERSION" != "$TAG" ]; then
              echo "::error::$NAME is $VERSION, tag says $TAG"
              FAILED=1
            fi
          done
          [ "$FAILED" = 0 ] || exit 1
          echo "all packages at $TAG"

      - name: Pack, and show exactly what would ship
        run: |
          for dir in packages/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            echo "── $name"
            # publishConfig.directory sends ng-packagr's dist; pnpm honours it.
            pnpm --filter "$name" pack --pack-destination /tmp/navx-packs
          done
          ls -la /tmp/navx-packs
          for tarball in /tmp/navx-packs/*.tgz; do
            echo "── $tarball"
            tar tzf "$tarball" | head -30
          done

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # --no-git-checks because the tag is the gate, and the working tree is a
        # clean checkout of it. --access public because the @navx scope defaults
        # to restricted and a first publish would otherwise 402.
        run: pnpm -r publish --access public --no-git-checks --provenance

      - name: Summarise
        if: always()
        run: |
          {
            echo "### @navx ${GITHUB_REF_NAME}"
            echo
            for manifest in packages/*/package.json; do
              node -p "const p=require('./$manifest'); \`- \\\`\${p.name}@\${p.version}\\\`\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
